name: Deploy HelpDesk Tracker to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'HelpDesk-Exp 1/package-lock.json'

      - name: Install dependencies
        working-directory: 'HelpDesk-Exp 1'
        run: npm ci

      - name: Build production bundle
        working-directory: 'HelpDesk-Exp 1'
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./'HelpDesk-Exp 1'/dist
